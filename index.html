<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棚割り確認用アプリ JANコード登録 Ver.0.8.3</title>
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 4px;
            background-color: #f4f4f9;
            color: #333;
            font-size: 0.85rem;
        }
        h1 {
            font-size: 0.95rem;
            text-align: center;
            margin: 2px 0 4px 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            padding: 6px 8px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: block;
        }
        button {
            padding: 6px;
            margin-top: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-blue { background-color: #007bff; width: 100%; }
        .btn-green { background-color: #28a745; flex: 2; }
        .btn-red { background-color: #dc3545; flex: 1; }
        .btn-clear { background-color: #dc3545; padding: 2px 4px; font-size: 0.75rem; width: 60px; margin-top: 0; }
        
        .form-row {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .form-group {
            flex: 1;
        }
        .action-buttons {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 0.75rem;
            margin-bottom: 1px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 4px;
            box-sizing: border-box;
            font-size: 0.95rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .status-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: 2px;
        }
        .log-area {
            font-size: 0.7rem;
            height: 45px;
            overflow-y: auto;
            background: #e9ecef;
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>棚割り確認用アプリ JANコード登録 Ver.0.8.3</h1>

    <div class="container">
        <!-- カメラ＆スキャン -->
        <div class="card" id="camera-card">
            <video id="video" autoplay muted playsinline></video>
            <button id="start-btn" class="btn-blue">カメラ起動 / スキャン開始</button>
        </div>

        <!-- 入力フォーム -->
        <div class="card">
            <form id="entry-form">
                <div>
                    <label>JANコード:</label>
                    <input type="text" id="jan" placeholder="バーコード読取 or 手入力" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>フェース:</label>
                        <input type="number" id="face" placeholder="" min="1">
                    </div>
                    <div class="form-group">
                        <label>段数:</label>
                        <input type="number" id="shelf" value="1" min="1" required>
                    </div>
                </div>

                <!-- 追加ボタンと、左側の赤いJANクリアボタン -->
                <div class="action-buttons">
                    <button type="button" id="jan-clear-btn" class="btn-red">JANクリア</button>
                    <button type="submit" class="btn-green">追加</button>
                </div>
            </form>
        </div>

        <!-- 蓄積データとCSV出力 -->
        <div class="card">
            <div class="status-area">
                <span>蓄積データ: <b id="count">0</b>件</span>
                <button type="button" id="clear-all-btn" class="btn-clear">クリア</button>
            </div>
            <div class="log-area" id="log">まだデータがありません</div>
            <button id="export-btn" class="btn-blue" style="margin-top: 4px; padding: 5px;">CSVファイルを保存する</button>
        </div>
    </div>

    <script>
        let codeReader;
        let scannedData = [];
        let isScanning = false;

        window.addEventListener('load', () => {
            codeReader = new ZXing.BrowserBarcodeReader();
        });

        const startBtn = document.getElementById('start-btn');
        const janInput = document.getElementById('jan');
        const faceInput = document.getElementById('face');
        const shelfInput = document.getElementById('shelf');
        const form = document.getElementById('entry-form');
        const logDiv = document.getElementById('log');
        const countSpan = document.getElementById('count');

        // スキャン処理の関数
        async function startScanning() {
            if (!codeReader) return;
            try {
                isScanning = true;
                startBtn.textContent = "スキャン停止";
                
                await codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
                    if (result) {
                        // すでにJANが入っている場合は、上書きせずにスキャンをストップ（ロックする）
                        if (!janInput.value) {
                            janInput.value = result.text;
                            if (navigator.vibrate) navigator.vibrate(100);
                            
                            // 読み取ったら自動でスキャンを一時停止してJANを固定
                            codeReader.reset();
                            isScanning = false;
                            startBtn.textContent = "カメラ再開 / スキャン開始";
                            
                            // フェースにフォーカス
                            faceInput.focus();
                        }
                    }
                });
            } catch (err) {
                console.error(err);
                isScanning = false;
                startBtn.textContent = "カメラ起動 / スキャン開始";
            }
        }

        // カメラ起動ボタン
        startBtn.addEventListener('click', async () => {
            if (isScanning) {
                codeReader.reset();
                isScanning = false;
                startBtn.textContent = "カメラ起動 / スキャン開始";
            } else {
                startScanning();
            }
        });

        // JANクリアボタン（赤いボックス）
        document.getElementById('jan-clear-btn').addEventListener('click', () => {
            janInput.value = '';
            faceInput.value = '';
            janInput.focus();
            // スキャンが止まっていたら再開できるようにする
            if (!isScanning) {
                startScanning();
            }
        });

        // データ追加
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const jan = janInput.value.trim();
            const face = faceInput.value.trim() === '' ? '1' : faceInput.value.trim();
            const shelf = shelfInput.value;

            if (!jan) {
                alert("JANコードを入力してください。");
                return;
            }

            scannedData.push({ jan, face, shelf });
            updateLog();

            // キーボードを閉じる
            document.activeElement.blur();

            // リセット
            janInput.value = '';
            faceInput.value = '';
            
            // 画面上部に戻す
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // 次の読み取りのために自動でスキャンを再開する
            setTimeout(() => {
                startScanning();
            }, 300);
        });

        function updateLog() {
            countSpan.textContent = scannedData.length;
            if (scannedData.length === 0) {
                logDiv.innerHTML = "まだデータがありません";
                return;
            }
            let html = "";
            scannedData.forEach((item, index) => {
                html += `${index + 1}: [JAN:${item.jan}] F:${item.face} / 段:${item.shelf}<br>`;
            });
            logDiv.innerHTML = html;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('export-btn').addEventListener('click', () => {
            if (scannedData.length === 0) {
                alert("保存するデータがありません。");
                return;
            }

            let csvContent = '\uFEFFJANコード,フェース,段数\n';
            scannedData.forEach(item => {
                csvContent += `"${item.jan}",${item.face},${item.shelf}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            const now = new Date();
            const timestamp = now.toISOString().slice(0,10).replace(/-/g,'') + '_' + now.toTimeString().slice(0,5).replace(/:/g,'');
            
            a.href = url;
            a.download = `tanowari_${timestamp}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        document.getElementById('clear-all-btn').addEventListener('click', () => {
            if (confirm("蓄積したデータをすべて削除しますか？")) {
                scannedData = [];
                updateLog();
            }
        });
    </script>
</body>
</html>
