<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棚割り確認用アプリ JANコード登録 Ver.1.0.4</title>
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 4px;
            background-color: #f4f4f9;
            color: #333;
            font-size: 0.85rem;
        }
        h1 {
            font-size: 0.95rem;
            text-align: center;
            margin: 2px 0 4px 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            padding: 6px 8px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video, canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        button {
            padding: 6px;
            margin-top: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-blue { background-color: #007bff; width: 100%; }
        .btn-green { background-color: #28a745; flex: 2; }
        .btn-red { background-color: #dc3545; flex: 1; }
        .btn-clear { background-color: #dc3545; padding: 2px 4px; font-size: 0.75rem; width: 60px; margin-top: 0; }
        
        .form-row {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .form-group {
            flex: 1;
        }
        .action-buttons {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 0.75rem;
            margin-bottom: 1px;
        }
        input[type="text"] {
            width: 100%;
            padding: 4px;
            box-sizing: border-box;
            font-size: 0.9rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        select {
            width: 100%;
            padding: 5px 2px;
            box-sizing: border-box;
            font-size: 0.9rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            text-align: center;
        }
        .status-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: 2px;
        }
        .log-area {
            font-size: 0.7rem;
            height: 45px;
            overflow-y: auto;
            background: #e9ecef;
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>棚割り確認用アプリ JANコード登録 Ver.1.0.4</h1>

    <div class="container">
        <!-- 店舗情報・カテゴリ入力エリア -->
        <div class="card">
            <div class="form-row" style="margin-top: 0;">
                <div class="form-group">
                    <label>店舗名:</label>
                    <input type="text" id="store-name" placeholder="例: 青森店">
                </div>
                <div class="form-group">
                    <label>カテゴリ:</label>
                    <input type="text" id="category-name" placeholder="例: 飲料">
                </div>
            </div>
        </div>

        <!-- カメラ＆スキャン / キャプチャ画像表示エリア -->
        <div class="card" id="camera-card">
            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="snapshot"></canvas>
            </div>
            <button id="start-btn" class="btn-blue">カメラ起動 / スキャン開始</button>
        </div>

        <!-- 入力フォーム -->
        <div class="card">
            <form id="entry-form">
                <div>
                    <label>JANコード:</label>
                    <input type="text" id="jan" placeholder="バーコード読取 or 手入力" required>
                </div>
                
                <!-- フェース・段数・台目を3つ並べる -->
                <div class="form-row">
                    <div class="form-group">
                        <label>フェース:</label>
                        <select id="face">
                            <option value="1" selected>1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>段数:</label>
                        <select id="shelf">
                            <option value="1" selected>1段</option>
                            <option value="2">2段</option>
                            <option value="3">3段</option>
                            <option value="4">4段</option>
                            <option value="5">5段</option>
                            <option value="6">6段</option>
                            <option value="7">7段</option>
                            <option value="8">8段</option>
                            <option value="9">9段</option>
                            <option value="10">10段</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>台目:</label>
                        <select id="daime">
                            <option value="1" selected>1台目</option>
                            <option value="2">2台目</option>
                            <option value="3">3台目</option>
                            <option value="4">4台目</option>
                            <option value="5">5台目</option>
                            <option value="6">6台目</option>
                            <option value="7">7台目</option>
                            <option value="8">8台目</option>
                            <option value="9">9台目</option>
                            <option value="10">10台目</option>
                        </select>
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="button" id="jan-clear-btn" class="btn-red">JANクリア</button>
                    <button type="button" id="undo-btn" class="btn-red" style="background-color: #d9534f;">直前を取消</button>
                    <button type="submit" class="btn-green">追加</button>
                </div>
            </form>
        </div>

        <!-- 蓄積データとCSV出力 -->
        <div class="card">
            <div class="status-area">
                <span>蓄積データ: <b id="count">0</b>件</span>
                <button type="button" id="clear-all-btn" class="btn-clear">クリア</button>
            </div>
            <div class="log-area" id="log">まだデータがありません</div>
            <button id="export-btn" class="btn-blue" style="margin-top: 4px; padding: 5px;">CSVファイルを保存する</button>
        </div>
    </div>

    <script>
        let codeReader;
        let scannedData = [];
        let isScanning = false;

        let positionCounters = {};
        let currentShelf = "1";

        window.addEventListener('load', () => {
            codeReader = new ZXing.BrowserBarcodeReader();
        });

        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('snapshot');
        const startBtn = document.getElementById('start-btn');
        const janInput = document.getElementById('jan');
        const faceSelect = document.getElementById('face');
        const shelfSelect = document.getElementById('shelf');
        const daimeSelect = document.getElementById('daime');
        const storeInput = document.getElementById('store-name');
        const categoryInput = document.getElementById('category-name');
        const form = document.getElementById('entry-form');
        const logDiv = document.getElementById('log');
        const countSpan = document.getElementById('count');

        shelfSelect.addEventListener('change', () => {
            currentShelf = shelfSelect.value;
        });

        async function startScanning() {
            if (!codeReader) return;
            
            canvasElement.style.display = 'none';
            videoElement.style.display = 'block';

            try {
                isScanning = true;
                startBtn.textContent = "スキャン停止";
                
                await codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
                    if (result) {
                        if (!janInput.value) {
                            const videoWidth = videoElement.videoWidth || 640;
                            const videoHeight = videoElement.videoHeight || 480;
                            
                            canvasElement.width = videoWidth;
                            canvasElement.height = videoHeight;
                            const context = canvasElement.getContext('2d');
                            context.drawImage(videoElement, 0, 0, videoWidth, videoHeight);
                            
                            videoElement.style.display = 'none';
                            canvasElement.style.display = 'block';

                            if (navigator.vibrate) navigator.vibrate(100);

                            setTimeout(() => {
                                janInput.value = result.text;
                                codeReader.reset();
                                isScanning = false;
                                startBtn.textContent = "カメラ再開 / スキャン開始";
                            }, 1000);
                        }
                    }
                });
            } catch (err) {
                console.error(err);
                isScanning = false;
                startBtn.textContent = "カメラ起動 / スキャン開始";
            }
        }

        startBtn.addEventListener('click', async () => {
            if (isScanning) {
                codeReader.reset();
                isScanning = false;
                startBtn.textContent = "カメラ起動 / スキャン開始";
                canvasElement.style.display = 'none';
                videoElement.style.display = 'block';
            } else {
                startScanning();
            }
        });

        document.getElementById('jan-clear-btn').addEventListener('click', () => {
            janInput.value = '';
            canvasElement.style.display = 'none';
            videoElement.style.display = 'block';
            if (!isScanning) {
                startScanning();
            }
        });

        document.getElementById('undo-btn').addEventListener('click', () => {
            if (scannedData.length === 0) {
                alert("取消すデータがありません。");
                return;
            }

            const lastItem = scannedData.pop();
            
            if (positionCounters[lastItem.shelf] && positionCounters[lastItem.shelf] > 1) {
                positionCounters[lastItem.shelf]--;
            } else {
                positionCounters[lastItem.shelf] = 1;
            }

            updateLog();
            alert(`直前のデータ（JAN: ${lastItem.jan} / 位置: ${lastItem.position}）を取り消しました。`);
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const jan = janInput.value.trim();
            const face = faceSelect.value;
            const shelf = shelfSelect.value;
            const daime = daimeSelect.value;

            if (!jan) {
                alert("JANコードを入力してください。");
                return;
            }

            if (currentShelf !== shelf) {
                currentShelf = shelf;
            }
            if (!positionCounters[shelf]) {
                positionCounters[shelf] = 1;
            }
            const position = positionCounters[shelf];
            
            if (positionCounters[shelf] < 50) {
                positionCounters[shelf]++;
            }

            scannedData.push({ jan, face, shelf, daime, position });
            updateLog();

            janInput.value = '';
            
            canvasElement.style.display = 'none';
            videoElement.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            setTimeout(() => {
                startScanning();
            }, 300);
        });

        function updateLog() {
            countSpan.textContent = scannedData.length;
            if (scannedData.length === 0) {
                logDiv.innerHTML = "まだデータがありません";
                return;
            }
            let html = "";
            scannedData.forEach((item, index) => {
                html += `${index + 1}: [JAN:${item.jan}] 台:${item.daime} / 段:${item.shelf} / 位置:${item.position} / F:${item.face}<br>`;
            });
            logDiv.innerHTML = html;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('export-btn').addEventListener('click', () => {
            if (scannedData.length === 0) {
                alert("保存するデータがありません。");
                return;
            }

            let csvContent = '\uFEFF台目,段数,位置,フェース,JANコード\n';
            scannedData.forEach(item => {
                csvContent += `${item.daime},${item.shelf},${item.position},${item.face},"${item.jan}"\n`;
            });

            const blobCsv = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blobCsv);
            const a = document.createElement('a');
            
            // 店舗名とカテゴリを取得（未入力の場合はデフォルト文字列に）
            const store = storeInput.value.trim() ? storeInput.value.trim() : '店舗未入力';
            const category = categoryInput.value.trim() ? categoryInput.value.trim() : 'カテゴリ未入力';
            
            // ファイル名に使えない文字が含まれている場合の簡易置換
            const safeStore = store.replace(/[\/\\?%*:|"<>]/g, '_');
            const safeCategory = category.replace(/[\/\\?%*:|"<>]/g, '_');

            const now = new Date();
            const timestamp = now.toISOString().slice(0,10).replace(/-/g,'') + '_' + now.toTimeString().slice(0,5).replace(/:/g,'');
            
            a.href = url;
            a.download = `${safeStore}_${safeCategory}_${timestamp}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        document.getElementById('clear-all-btn').addEventListener('click', () => {
            if (confirm("蓄積したデータをすべて削除しますか？")) {
                scannedData = [];
                positionCounters = {};
                updateLog();
            }
        });
    </script>
</body>
</html>
